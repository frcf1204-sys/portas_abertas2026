        <div class="contact-container">
            <h2>Get in touch</h2>
            <p class="subtitle">Send your opinion, questions, or comments about our work.</p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label>Full name (required)</label>
                    <input type="text" name="nome" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-group">
                    <label>Phone (required)</label>
                    <input type="tel" name="telefone" placeholder="(19) 94002-8922" required>
                </div>

                <div class="form-group">
                    <label>Email (required)</label>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label>Rate our website</label>
                    <select name="nota">
                        <option value="" disabled selected>Choose a rating</option>
                        <option value="10">10 - Excellent</option>
                        <option value="9">9 - Very Good</option>
                        <option value="8">8 - Good</option>
                        <option value="7">7 - Fair</option>
                        <option value="6">6 - So-so</option>
                        <option value="5">5 - Average</option>
                        <option value="4">4 - Kinda Bad</option>
                        <option value="3">3 - Bad</option>
                        <option value="2">2 - I could kick the keyboard and do better</option>
                        <option value="1">1 - God forbid</option>
                        <option value="0">0 - Just give up</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Comment</label>
                    <textarea name="comentario" placeholder="Leave your comment here"></textarea>
                </div>

                <div class="form-buttons">
                    <button type="submit">Submit comment</button>
                    <button type="reset">Clear</button>
                </div>
            </form>
        </div>
